upload = "browser"
hashtags = ["#shorts", "#twitch", "#streamer", "#clips"]

# ---------------------------------------------------------------- Streamer
# Layout wird automatisch erkannt:
#   Gameplay mit Facecam -> Facecam oben, Gameplay unten
#   Streamer füllt das Bild (Just Chatting) -> Zuschnitt auf den Streamer
#   kein Gesicht erkannt -> ganzes Bild mit unscharfem Hintergrund (zoom = Vergrößerung)
# Manuelle Facecam (überschreibt Erkennung): facecam = [x, y, breite, höhe] in Anteilen 0-1
# channel = zu welchem Kanal die Clips gehören

